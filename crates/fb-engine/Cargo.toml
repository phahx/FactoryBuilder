[package]
name = "fb-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["solver"]
# Docs parser + planner, used by the native backend.
solver = ["dep:serde_json", "dep:miniz_oxide"]

[dependencies]
fb-model.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
petgraph.workspace = true
# microlp is pure Rust, so the wasm UI can use good_lp for the flow sim too.
good_lp.workspace = true
# Save files are zlib-compressed.
miniz_oxide = { version = "0.9.1", optional = true }
