<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Builder</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #202329; }
    canvas#app { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center;
               color: #c9ccd3; font: 15px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="loading">Loading Factory Builder…</div>
  <script type="module">
    import init from "./fb_ui.js";
    init().catch((e) => {
      document.getElementById("loading").textContent = "Factory Builder failed to load: " + e;
    });
  </script>
</body>
</html>
